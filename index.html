<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>성가대 파트 연습실</title>
<style>
/* 전체 기본 설정 */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 12px 36px;
    background: #26352F;
    color: #DDE8D9;
    font-family: Arial, "Malgun Gothic", sans-serif;
    text-align: center;
}

/* 페이지 너비 */
main {
    max-width: 980px;
    margin: 0 auto;
}

/* 제목 */
h1 {
    margin: 8px 0 6px;
    color: #34483B;
    font-size: clamp(23px, 4vw, 34px);
}

h2, h3 {
    color: #34483B;
}

.subtitle {
    margin: 0 0 22px;
    color: #758675;
    letter-spacing: 2px;
    font-size: 12px;
}

/* 음악 플레이어 */
.player-card {
    padding: 16px;
    background: #EAEDE4;
    border: 1px solid #D2DCCF;
    border-radius: 18px;
    box-shadow: 0 5px 18px #34483B15;
}

#nowPlaying {
    margin: 0 0 12px;
    color: #496B50;
    font-weight: bold;
}

/* 영상 영역 */
.video-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: 220px;
    background: #D8E0D5;
    border-radius: 12px;
    overflow: hidden;
}

.video-box iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

/* 파트 선택 안내 */
.section-title {
    margin: 22px 0 10px;
    color: #496B50;
    font-weight: bold;
}

/* 버튼 영역 */
.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
}

/* 모든 버튼 */
button, .action {
    border: 1px solid #B8CBB9;
    border-radius: 12px;
    padding: 12px 16px;
    background: #DCE8DC;
    color: #34483B;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
}

/* 마우스 올렸을 때 */
button:hover, .action:hover {
    background: #C6D9C8;
}

/* 선택된 파트 */
button[aria-pressed="true"] {
    background: #496B50;
    border-color: #496B50;
    color: #FFFFFF;
}

/* 재생 관련 버튼 */
.actions {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
}

/* 안내문 */
.notice {
    max-width: 760px;
    margin: 18px auto 0;
    color: #68786B;
    font-size: 12px;
    line-height: 1.7;
    text-align: left;
}

/* 모바일 화면 */
@media (max-width: 560px) {
    body {
        padding: 14px 10px 28px;
    }

    .player-card {
        padding: 10px;
    }

    button, .action {
        flex: 1 1 42%;
    }
}
</style>
</head>
<body>
<main>
  <h1>성가대 연습실</h1>
  <p class="subtitle">CHORAL PRACTICE</p>

  <section class="player-card">
    <p id="nowPlaying">현재 선택: 합창</p>
    <div class="video-box">
      <iframe id="youtubePlayer"
        src="https://www.youtube.com/embed/WDo9-MQaFdA?playsinline=1&rel=0"
        title="성가대 연습 영상"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
    <div class="actions">
      <a class="action" id="youtubeLink"
         href="https://www.youtube.com/watch?v=WDo9-MQaFdA"
         target="_blank" rel="noopener noreferrer">유튜브에서 열기 ↗</a>
      <button type="button" id="loopButton" aria-pressed="false">반복 재생: 꺼짐</button>
    </div>
  </section>

  <p class="section-title">연습할 파트를 선택하세요</p>
  <div class="buttons" id="partButtons">
    <button type="button" data-label="합창" data-video="WDo9-MQaFdA" aria-pressed="true">합창</button>
    <button type="button" data-label="소프라노｜Vocal" data-video="5nVisA0XzUs" aria-pressed="false">소프라노｜Vocal</button>
    <button type="button" data-label="알토｜Vocal" data-video="X0dCuh9HJLc" aria-pressed="false">알토｜Vocal</button>
    <button type="button" data-label="테너｜Vocal" data-video="6lKgIc-pcwg" aria-pressed="false">테너｜Vocal</button>
    <button type="button" data-label="베이스｜Vocal" data-video="cOuN-sN6P7Y" aria-pressed="false">베이스｜Vocal</button>
  </div>
</main>

<script>
const player = document.getElementById("youtubePlayer");
const nowPlaying = document.getElementById("nowPlaying");
const youtubeLink = document.getElementById("youtubeLink");
const loopButton = document.getElementById("loopButton");

let loopEnabled = false;
let currentVideoId = "WDo9-MQaFdA";

function makeEmbedUrl(videoId) {
  const params = new URLSearchParams({
    playsinline: "1",
    rel: "0"
  });
  if (loopEnabled) {
    params.set("loop", "1");
    params.set("playlist", videoId);
  }
  return "https://www.youtube.com/embed/" + encodeURIComponent(videoId) + "?" + params.toString();
}

function playVideo(videoId, label, clickedButton) {
  if (!videoId) {
    alert("아직 이 파트의 영상 주소가 입력되지 않았습니다. HTML의 data-video에 유튜브 영상 ID를 넣어주세요.");
    return;
  }

  currentVideoId = videoId;
  player.src = makeEmbedUrl(videoId);
  youtubeLink.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
  nowPlaying.textContent = "현재 선택: " + label;

  document.querySelectorAll("#partButtons button, #midiButtons button")
    .forEach(button => button.setAttribute("aria-pressed", String(button === clickedButton)));
}

document.querySelectorAll("#partButtons button, #midiButtons button")
  .forEach(button => {
    button.addEventListener("click", () => {
      playVideo(button.dataset.video, button.dataset.label, button);
    });
  });

loopButton.addEventListener("click", () => {
  loopEnabled = !loopEnabled;
  loopButton.setAttribute("aria-pressed", String(loopEnabled));
  loopButton.textContent = "반복 재생: " + (loopEnabled ? "켜짐" : "꺼짐");
  player.src = makeEmbedUrl(currentVideoId);
});
</script>
</body>
</html>
