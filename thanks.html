<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>성가대 파트 연습실</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 18px 12px 36px;
  background: #101720; color: #f4f1e9;
  font-family: Arial, "Malgun Gothic", sans-serif;
  text-align: center;
}
main { max-width: 980px; margin: 0 auto; }
h1 { margin: 8px 0 6px; color: #f0d59c; font-size: clamp(23px, 4vw, 34px); }
.subtitle { margin: 0 0 22px; color: #aeb8c5; letter-spacing: 2px; font-size: 12px; }
.player-card {
  padding: 16px; background: #1a2532;
  border: 1px solid #394657; border-radius: 18px;
  box-shadow: 0 12px 32px #0005;
}
#nowPlaying { margin: 0 0 12px; color: #f0d59c; font-weight: bold; }
.video-box {
  position: relative; width: 100%; aspect-ratio: 16 / 9;
  min-height: 220px; background: #05080c;
  border-radius: 12px; overflow: hidden;
}
.video-box iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
}
.section-title { margin: 22px 0 10px; color: #d9c49b; font-weight: bold; }
.buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
button, .action {
  border: 1px solid #536276; border-radius: 12px;
  padding: 12px 16px; background: #253344; color: #f4f1e9;
  font-size: 15px; cursor: pointer; text-decoration: none;
}
button:hover, .action:hover { background: #40536a; }
button[aria-pressed="true"] { background: #536b57; border-color: #9ac49f; }
.actions { margin-top: 14px; display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; }
.notice {
  max-width: 760px; margin: 18px auto 0; color: #aeb8c5;
  font-size: 12px; line-height: 1.7; text-align: left;
}
@media (max-width: 560px) {
  body { padding: 14px 10px 28px; }
  .player-card { padding: 10px; }
  button, .action { flex: 1 1 42%; }
}
</style>
</head>
<body>
<main>
  <h1>성가 연습실</h1>
  <p class="subtitle">CHORAL PRACTICE</p>

  <section class="player-card">
    <p id="nowPlaying">현재 선택: 합창</p>
    <div class="video-box">
      <iframe id="youtubePlayer"
        src="https://www.youtube.com/embed/WDo9-MQaFdA?playsinline=1&rel=0"
        title="성가대 연습 영상"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
    <div class="actions">
      <a class="action" id="youtubeLink"
         href="https://www.youtube.com/watch?v=WDo9-MQaFdA"
         target="_blank" rel="noopener noreferrer">유튜브에서 열기 ↗</a>
      <button type="button" id="loopButton" aria-pressed="false">반복 재생: 꺼짐</button>
    </div>
  </section>

  <p class="section-title">연습할 파트를 선택하세요</p>
  <div class="buttons" id="partButtons">
    <button type="button" data-label="합창" data-video="WDo9-MQaFdA" aria-pressed="true">합창</button>
    <button type="button" data-label="소프라노｜Vocal" data-video="5nVisA0XzUs" aria-pressed="false">소프｜Vocal</button>
    <button type="button" data-label="알토｜Vocal" data-video="X0dCuh9HJLc" aria-pressed="false">알토｜Vocal</button>
    <button type="button" data-label="테너｜Vocal" data-video="6lKgIc-pcwg" aria-pressed="false">테너｜Vocal</button>
    <button type="button" data-label="베이스｜Vocal" data-video="cOuN-sN6P7Y" aria-pressed="false">베이스｜Vocal</button>
    <button type="button" data-label="반주｜Piano" data-video="" aria-pressed="false">반주｜Piano</button>
  </div>

  <p class="section-title">MIDI 연습</p>
  <div class="buttons" id="midiButtons">
    <button type="button" data-label="소프라노｜MIDI" data-video="" aria-pressed="false">소프｜MIDI</button>
    <button type="button" data-label="알토｜MIDI" data-video="" aria-pressed="false">알토｜MIDI</button>
    <button type="button" data-label="테너｜MIDI" data-video="" aria-pressed="false">테너｜MIDI</button>
    <button type="button" data-label="베이스｜MIDI" data-video="" aria-pressed="false">베이스｜MIDI</button>
  </div>

  <p class="notice">
    영상이 재생되지 않으면 '유튜브에서 열기'를 눌러 확인해 주세요.
    영상 소유자가 외부 삽입을 제한했거나 브라우저·지역·연령 설정에 따라
    페이지 안에서 재생되지 않을 수 있습니다. 반복 재생은 임베드 플레이어에서 지원될 때 작동합니다.
  </p>
</main>

<script>
const player = document.getElementById("youtubePlayer");
const nowPlaying = document.getElementById("nowPlaying");
const youtubeLink = document.getElementById("youtubeLink");
const loopButton = document.getElementById("loopButton");

let loopEnabled = false;
let currentVideoId = "WDo9-MQaFdA";

function makeEmbedUrl(videoId) {
  const params = new URLSearchParams({
    playsinline: "1",
    rel: "0"
  });
  if (loopEnabled) {
    params.set("loop", "1");
    params.set("playlist", videoId);
  }
  return "https://www.youtube.com/embed/" + encodeURIComponent(videoId) + "?" + params.toString();
}

function playVideo(videoId, label, clickedButton) {
  if (!videoId) {
    alert("아직 이 파트의 영상 주소가 입력되지 않았습니다. HTML의 data-video에 유튜브 영상 ID를 넣어주세요.");
    return;
  }

  currentVideoId = videoId;
  player.src = makeEmbedUrl(videoId);
  youtubeLink.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
  nowPlaying.textContent = "현재 선택: " + label;

  document.querySelectorAll("#partButtons button, #midiButtons button")
    .forEach(button => button.setAttribute("aria-pressed", String(button === clickedButton)));
}

document.querySelectorAll("#partButtons button, #midiButtons button")
  .forEach(button => {
    button.addEventListener("click", () => {
      playVideo(button.dataset.video, button.dataset.label, button);
    });
  });

loopButton.addEventListener("click", () => {
  loopEnabled = !loopEnabled;
  loopButton.setAttribute("aria-pressed", String(loopEnabled));
  loopButton.textContent = "반복 재생: " + (loopEnabled ? "켜짐" : "꺼짐");
  player.src = makeEmbedUrl(currentVideoId);
});
</script>
</body>
</html>
